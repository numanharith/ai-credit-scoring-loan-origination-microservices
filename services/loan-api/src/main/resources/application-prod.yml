# services/loan-api/src/main/resources/application-prod.yml
spring:
  datasource:
    hikari:
      maximum-pool-size: 20

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # Never modify schema in prod

logging:
  level:
    root: WARN
    com.portfolio: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # Limited endpoints in prod