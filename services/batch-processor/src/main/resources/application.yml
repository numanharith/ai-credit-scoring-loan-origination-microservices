# services/batch-processor/src/main/resources/application.yml
spring:
  profiles:
    include: common,oracle
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: batch-processor-service

  # Optimized for batch processing
  datasource:
    url: jdbc:oracle:thin:@creditloanorigination_medium?TNS_ADMIN=${ORACLE_WALLET_PATH:./oracle-wallet}
    username: ${ORACLE_USERNAME:}
    password: ${ORACLE_PASSWORD}
    hikari:
      maximum-pool-size: 20  # Large pool for batch operations
      minimum-idle: 10

  # Batch-specific JPA settings
  jpa:
    properties:
      hibernate:
        jdbc.batch_size: 50    # Larger batch size
        jdbc.fetch_size: 200
        cache.use_second_level_cache: false

  # Batch job settings
  batch:
    job:
      enabled: false  # Don't auto-start jobs
    jdbc:
      initialize-schema: always

server:
  port: ${SERVER_PORT:8082}

# Batch job scheduling
batch:
  jobs:
    reconciliation:
      cron: "0 0 23 * * ?"  # 11 PM daily
      chunk-size: 1000
    analytics:
      cron: "0 0 2 ? * SUN"  # 2 AM Sundays
      chunk-size: 5000

logging:
  level:
    com.portfolio.batch: DEBUG
    org.springframework.batch: INFO